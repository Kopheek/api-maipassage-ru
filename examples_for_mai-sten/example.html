<!-- Вставить в <head> или перед </body> -->
<script src="maipassage.js"></script>

<b>Первый блок цитаты с существующим автором:</b>

<!-- Блок с цитатой -->
<div data-quote-author="Моржин"> <!-- Вместо "Моржин" указать желаемую фамилию -->
    <p data-quote-text>Загрузка цитаты...</p> <!-- Текст с которым прогружается цитата -->
    <p data-quote-author-name></p> <!-- "Вызов" функции прогрузки цитаты -->
</div>

<b>И вот второй блок с другим текстом прогрузки и несуществующим в локальной памяти api.maipassage.ru автором:</b>

<!-- Другой блок с цитатой, как доп. пример когда не найдена цитата -->
<div data-quote-author="Некто с военки">
    <p data-quote-text>...</p>
    <p data-quote-author-name></p>
</div>
